name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! 🐙
        Setup questions belong in [Q&A](https://github.com/s2b-dev/smart-second-brain/discussions/categories/q-a); check the [troubleshooting guide](https://smartsecondbrain.dev/help/troubleshooting/) first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? A screenshot or screen recording helps a lot.
      placeholder: |
        1. Open a chat and ask "…"
        2. The agent calls manage_notes
        3. Expected the change to show up in the review bar, but …
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: |
        In **Settings → Smart Second Brain → Troubleshooting**, enable *Developer Console logging*. Then open the developer console (`Cmd+Opt+I` on macOS, `Ctrl+Shift+I` on Windows/Linux; on mobile see the [troubleshooting guide](https://smartsecondbrain.dev/help/troubleshooting/)), reproduce the problem, and paste anything red or anything prefixed with `[S2B]`.
      render: text
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Settings → Community plugins → Installed plugins → Smart Second Brain.
      placeholder: "2.0.2"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - iOS / iPadOS
        - Android
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model (if relevant)
      description: Which chat / embedding provider and model were configured when this happened? Never paste API keys.
      placeholder: "Ollama, qwen3:8b chat + nomic-embed-text; or OpenRouter, anthropic/claude-sonnet-5"
  - type: textarea
    id: debug-info
    attributes:
      label: Obsidian debug info
      description: Command palette → *Show debug info* → *Copy to clipboard*. Includes Obsidian version, installer version, and the other plugins you have enabled.
      render: text
    validations:
      required: true
