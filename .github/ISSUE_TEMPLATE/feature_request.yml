name: Feature request
description: Suggest something S2B should do.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! 🐙
        Not sure it's fully formed yet? Post it in [Ideas](https://github.com/s2b-dev/smart-second-brain/discussions/categories/ideas) first; we promote discussions to issues once there's a plan.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search
        - Smart graph
        - Agent / chat
        - Skills / integrations
        - Providers / models
        - Memory
        - Mobile
        - Settings / onboarding
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that S2B makes hard or impossible today?
      placeholder: "When I …, I have to … because …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? If you have a UI or workflow in mind, describe it or sketch it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and prior art
      description: Other ways to solve this, or plugins / tools that already do something similar.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to work on this myself (see CONTRIBUTING.md)
